version: '3'
services:
  leafy-postgres:
    # build: ./leafy-postgresql
    image: ltm0714/leafy-postgres:2a43f5b183f35e130a5a88420f3123b4cbf2d9a5
    # image: leafy-postgres:5.0.0-compose
    volumes:
      - mydata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    restart: always

  leafy-backend:
    build: ./leafy-backend
    image: leafy-backend:5.0.0-compose
    environment:
      - DB_URL=leafy-postgres
    depends_on:
      - leafy-postgres
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
    restart: on-failure
      
  leafy-frontend:
    # build: ./leafy-frontend
    image: ltm0714/leafy-frontend:207aaf462db85525bf71df2b9f779caf48245a84
    # image: leafy-frontend:5.0.0-compose
    environment:
      - BACKEND_HOST=leafy-backend
    ports:
      - 81:80
    depends_on:
      - leafy-backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
    restart: on-failure

volumes:
  mydata: